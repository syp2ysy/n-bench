<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R2R 案例展示</title>
  <style>

    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #17191f; }
    header, section { max-width: 1220px; margin: 0 auto; padding: 28px 24px; }
    header { border-bottom: 1px solid #d7dce3; }
    h1 { margin: 4px 0 10px; font-size: 32px; line-height: 1.1; }
    h2 { margin: 0 0 14px; font-size: 22px; }
    h3 { margin: 10px 0; font-size: 17px; line-height: 1.35; }
    p { line-height: 1.5; }
    .eyebrow { margin: 0; color: #657386; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
    .lead { max-width: 900px; color: #465261; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
    .metric { background: #fff; border: 1px solid #d7dce3; border-radius: 8px; padding: 14px; }
    .metric strong { display: block; font-size: 26px; color: #102033; }
    .metric span { color: #657386; font-size: 13px; }
    .status-pass { color: #146b3a; font-weight: 700; }
    .status-fail { color: #9a3412; font-weight: 700; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 12px 0 16px; }
    .stat-card { background: #fff; border: 1px solid #d7dce3; border-radius: 8px; padding: 12px; }
    .stat-card strong { display: block; color: #102033; font-size: 22px; overflow-wrap: anywhere; }
    .stat-card span { color: #657386; font-size: 12px; }
    .violation-list { display: grid; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
    .violation-list li { border: 1px solid #f2c6a0; background: #fff7ed; color: #7c2d12; border-radius: 8px; padding: 10px 12px; }
    table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid #d7dce3; }
    th, td { border-bottom: 1px solid #d7dce3; padding: 10px 12px; text-align: left; vertical-align: top; }
    th { width: 240px; background: #eef1f4; }
    .category-table th { width: auto; }
    .category-table td:first-child { font-weight: 700; color: #173f65; }
    .two-col { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 16px; align-items: start; }
    .note { color: #465261; }
    .case-group > p { color: #465261; max-width: 940px; }
    .case-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .case-card { display: grid; grid-template-columns: minmax(300px, 44%) 1fr; gap: 16px; padding: 14px; background: #fff; border: 1px solid #d7dce3; border-radius: 8px; }
    .media { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
    .media figure { margin: 0; }
    .media img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border: 1px solid #d7dce3; border-radius: 6px 6px 0 0; background: #111827; display: block; }
    .media figcaption { padding: 7px 8px; border: 1px solid #d7dce3; border-top: 0; border-radius: 0 0 6px 6px; color: #465261; background: #f8fafc; font-size: 12px; }
    .case-body { min-width: 0; }
    .case-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: #657386; font-size: 12px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 999px; background: #e8eef8; color: #29466f; font-size: 12px; }
    .qa-grid { display: grid; grid-template-columns: minmax(180px, .8fr) 1fr; gap: 12px; }
    .answer-box { border: 1px solid #b8c7d9; border-radius: 8px; padding: 10px 12px; background: #f2f7fd; }
    .answer-box p { margin: 8px 0 0; font-size: 24px; line-height: 1.15; color: #173f65; font-weight: 700; overflow-wrap: anywhere; }
    .evidence { margin-top: 10px; border-top: 1px solid #e0e5eb; }
    .evidence p { display: grid; grid-template-columns: 132px 1fr; gap: 12px; margin: 0; padding: 9px 0; border-bottom: 1px solid #e8edf2; }
    .evidence strong { color: #263445; }
    .evidence span { color: #303b49; overflow-wrap: anywhere; }
    ul { margin: 6px 0 0; padding-left: 18px; }
    .empty { background: #fff; border: 1px solid #d7dce3; border-left: 5px solid #c08428; border-radius: 8px; padding: 16px; color: #6b4511; }
    @media (max-width: 820px) {
      h1 { font-size: 28px; }
      .two-col, .case-card, .qa-grid, .evidence p { grid-template-columns: 1fr; }
      .media { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

        <header>
          <p class="eyebrow">EgoConseq-Bench</p>
          <h1>R2R 案例展示</h1>
          <p class="lead">当前还没有通过接收标准的 R2R RGB/深度/位姿案例。发布前需要先运行确定性 R2R 案例生成工具。</p>
        </header>
        <section><p class="empty">当前流程不会展示 LLM 想象出来的占位案例，只展示真实数据生成的案例。</p></section>
        
</body>
</html>
