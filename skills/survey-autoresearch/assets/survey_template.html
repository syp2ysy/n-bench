<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --paper: #ffffff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #e5e7eb;
      --soft: #f1f5f9;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.68;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hero {
      background: linear-gradient(180deg, #eef4ff 0%, #f7f8fb 100%);
      border-bottom: 1px solid var(--line);
      padding: 48px 24px 28px;
    }
    .hero-inner, .layout { max-width: 1180px; margin: 0 auto; }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 28px;
      padding: 28px 24px 48px;
    }
    .toc {
      position: sticky;
      top: 18px;
      align-self: start;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      max-height: calc(100vh - 36px);
      overflow: auto;
    }
    .toc h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .toc a {
      display: block;
      padding: 6px 0;
      font-size: 0.92rem;
      color: #344054;
    }
    main {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(22px, 4vw, 48px);
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.05);
    }
    article h1, article h2, article h3, article h4 {
      line-height: 1.22;
      letter-spacing: 0;
      margin: 1.6em 0 0.55em;
    }
    article h1:first-child, article h2:first-child { margin-top: 0; }
    article p { margin: 0 0 1em; }
    article ul, article ol { padding-left: 1.35rem; }
    article blockquote {
      margin: 1.2em 0;
      padding: 0.2em 1em;
      border-left: 3px solid var(--accent);
      background: var(--soft);
      color: #344054;
    }
    code {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0.1rem 0.28rem;
      font-size: 0.92em;
    }
    pre {
      overflow: auto;
      padding: 16px;
      background: #0f172a;
      color: #e5e7eb;
      border-radius: var(--radius);
    }
    pre code { background: transparent; border: 0; color: inherit; padding: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
      font-size: 0.95rem;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 9px 10px;
      vertical-align: top;
    }
    th { background: var(--soft); text-align: left; }
    .references {
      margin-top: 44px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .reference-list { display: grid; gap: 12px; }
    .reference-item {
      border: 1px solid var(--line);
      background: #fcfcfd;
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .reference-title { font-weight: 650; }
    .reference-meta { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
    .source-limited {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #1d4ed8;
      font-size: 0.78rem;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .toc { position: static; max-height: none; }
      main { padding: 22px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>{{title}}</h1>
      <div class="meta">{{subtitle}}</div>
    </div>
  </header>
  <div class="layout">
    <nav class="toc" aria-label="Table of contents">
      <h2>Contents</h2>
      {{toc}}
    </nav>
    <main>
      <article>
        {{content}}
      </article>
      <section class="references" id="references">
        <h2>References</h2>
        <div class="reference-list">
          {{references}}
        </div>
      </section>
    </main>
  </div>
</body>
</html>
